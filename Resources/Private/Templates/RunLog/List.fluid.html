<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:jev="http://typo3.org/ns/Webconsulting/WebconJev/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="webcon-jev-module" href="EXT:webcon_jev/Resources/Public/Css/module.css" />

    <h1><f:translate key="runs.title" domain="webcon_jev.module" /></h1>
    <p class="webcon-jev-lead"><f:translate key="runs.intro" domain="webcon_jev.module" /></p>

    <form action="{formUrl}" method="post" class="webcon-jev-filter" role="search" aria-label="{f:translate(key: 'runs.filter.label', domain: 'webcon_jev.module')}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="webcon-jev-filter-decision"><f:translate key="runs.filter.decision" domain="webcon_jev.module" /></label>
                <select class="form-select" id="webcon-jev-filter-decision" name="filter[decision]">
                    <option value="0"><f:translate key="runs.filter.decision.all" domain="webcon_jev.module" /></option>
                    <f:for each="{decisions}" as="decision">
                        <option value="{decision.uid}" {f:if(condition: '{decision.uid} == {filter.decision}', then: 'selected')}>{decision.title}</option>
                    </f:for>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="webcon-jev-filter-context"><f:translate key="runs.filter.context" domain="webcon_jev.module" /></label>
                <select class="form-select" id="webcon-jev-filter-context" name="filter[context]">
                    <option value=""><f:translate key="runs.filter.context.all" domain="webcon_jev.module" /></option>
                    <f:for each="{contexts}" as="context">
                        <option value="{context}" {f:if(condition: '{context} == {filter.context}', then: 'selected')}><f:translate key="context.{context}" domain="webcon_jev.module" default="{context}" /></option>
                    </f:for>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="webcon-jev-filter-outcome"><f:translate key="runs.filter.outcome" domain="webcon_jev.module" /></label>
                <select class="form-select" id="webcon-jev-filter-outcome" name="filter[outcome]">
                    <option value=""><f:translate key="runs.filter.outcome.all" domain="webcon_jev.module" /></option>
                    <f:for each="{outcomes}" as="outcome">
                        <option value="{outcome}" {f:if(condition: '{outcome} == {filter.outcome}', then: 'selected')}><f:translate key="outcome.{outcome}" domain="webcon_jev.module" /></option>
                    </f:for>
                </select>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-default">
                    <core:icon identifier="actions-filter" />
                    <f:translate key="runs.filter.submit" domain="webcon_jev.module" />
                </button>
                <f:if condition="{filter.active}">
                    <a class="btn btn-link" href="{resetUrl}"><f:translate key="runs.filter.reset" domain="webcon_jev.module" /></a>
                </f:if>
            </div>
        </div>
    </form>

    <f:if condition="{runs}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <caption class="visually-hidden"><f:translate key="runs.caption" domain="webcon_jev.module" /></caption>
                    <thead>
                        <tr>
                            <th scope="col"><f:translate key="runs.column.when" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="runs.column.decision" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="runs.column.context" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="runs.column.answers" domain="webcon_jev.module" /></th>
                            <th scope="col" class="text-end"><f:translate key="runs.column.latency" domain="webcon_jev.module" /></th>
                            <th scope="col" class="text-end"><f:translate key="runs.column.tokens" domain="webcon_jev.module" /></th>
                            <th scope="col" class="text-end"><f:translate key="runs.column.cost" domain="webcon_jev.module" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{runs}" as="item">
                            <tr>
                                <td class="text-nowrap">
                                    <time datetime="{f:format.date(date: item.run.createdAt, format: 'c')}"><f:format.date date="{item.run.createdAt}" pattern="MEDIUM" /></time>
                                </td>
                                <td>
                                    <f:if condition="{item.decisionUrl}">
                                        <f:then><a href="{item.decisionUrl}">{item.decisionTitle}</a></f:then>
                                        <f:else><span class="text-variant"><f:translate key="runs.decision.gone" domain="webcon_jev.module" /></span></f:else>
                                    </f:if>
                                    <div class="webcon-jev-mono text-variant">{item.run.decisionIdentifier}</div>
                                </td>
                                <td>
                                    <span class="badge badge-default"><f:translate key="context.{item.run.context}" domain="webcon_jev.module" default="{item.run.context}" /></span>
                                    <f:if condition="{item.run.cached}">
                                        <span class="badge badge-info"><f:translate key="outcome.cached" domain="webcon_jev.module" /></span>
                                    </f:if>
                                    <f:if condition="{item.run.fallback}">
                                        <span class="badge badge-danger"><f:translate key="outcome.fallback" domain="webcon_jev.module" /></span>
                                    </f:if>
                                    <div class="text-variant">{item.run.origin}</div>
                                </td>
                                <td>
                                    <f:if condition="{item.run.fallback}">
                                        <f:then>
                                            <span class="text-variant">{item.run.fallbackReason}</span>
                                        </f:then>
                                        <f:else>
                                            <ul class="webcon-jev-plain-list">
                                                <f:for each="{item.run.answers}" as="answer">
                                                    <li>
                                                        <span class="webcon-jev-mono">{answer.name}={answer.value}</span>
                                                        <span class="text-variant">(<jev:format.number value="{answer.confidence}" style="percent" />)</span>
                                                    </li>
                                                </f:for>
                                            </ul>
                                        </f:else>
                                    </f:if>
                                </td>
                                <f:if condition="{item.run.cached}">
                                    <f:then>
                                        <f:comment>A reused answer took no time and cost nothing; its row only keeps what it was computed on.</f:comment>
                                        <td class="text-end text-variant">—</td>
                                        <td class="text-end text-variant">—</td>
                                        <td class="text-end text-variant">—</td>
                                    </f:then>
                                    <f:else>
                                        <td class="text-end text-nowrap">
                                            <f:if condition="{item.run.durationMs} >= 1">
                                                <f:then><jev:format.number value="{item.run.durationMs}" />&nbsp;ms</f:then>
                                                <f:else><span class="text-variant">—</span></f:else>
                                            </f:if>
                                        </td>
                                        <td class="text-end"><jev:format.number value="{item.run.inputTokens}" /></td>
                                        <td class="text-end text-nowrap"><jev:format.number value="{item.run.costUsd}" style="usd" /></td>
                                    </f:else>
                                </f:if>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <f:render partial="Jev/Pagination" arguments="{paginator: paginator, pagination: pagination, pageUrls: pageUrls}" />
            <p class="text-variant"><f:translate key="runs.retention" domain="webcon_jev.module" /></p>
        </f:then>
        <f:else>
            <f:if condition="{filter.active}">
                <f:then>
                    <f:be.infobox
                        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::NOTICE')}"
                        title="{f:translate(key: 'runs.empty.filtered.title', domain: 'webcon_jev.module')}"
                        iconName="actions-filter"
                    >
                        <p><f:translate key="runs.empty.filtered.message" domain="webcon_jev.module" /></p>
                        <a class="btn btn-default" href="{resetUrl}"><f:translate key="runs.filter.reset" domain="webcon_jev.module" /></a>
                    </f:be.infobox>
                </f:then>
                <f:else>
                    <f:be.infobox
                        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                        title="{f:translate(key: 'runs.empty.title', domain: 'webcon_jev.module')}"
                    >
                        <p><f:translate key="runs.empty.message" domain="webcon_jev.module" /></p>
                        <a class="btn btn-primary" href="{decisionsUrl}"><f:translate key="runs.empty.action" domain="webcon_jev.module" /></a>
                    </f:be.infobox>
                </f:else>
            </f:if>
        </f:else>
    </f:if>
</f:section>

</html>
