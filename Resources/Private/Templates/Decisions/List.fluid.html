<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:jev="http://typo3.org/ns/Webconsulting/WebconJev/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="webcon-jev-module" href="EXT:webcon_jev/Resources/Public/Css/module.css" />
    <f:asset.module identifier="@webconsulting/webcon-jev/decision-list.js" />

    <h1><f:translate key="decisions.title" domain="webcon_jev.module" /></h1>
    <p class="webcon-jev-lead"><f:translate key="decisions.intro" domain="webcon_jev.module" /></p>

    <f:render partial="Jev/StatusCallouts" arguments="{tokenPresent: tokenPresent, enabled: enabled, connectionUrl: connectionUrl}" />

    <f:if condition="{rows}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover" data-webcon-jev-decisions data-delete-url="{deleteUrl}">
                    <caption class="visually-hidden"><f:translate key="decisions.caption" domain="webcon_jev.module" /></caption>
                    <thead>
                        <tr>
                            <th scope="col" class="col-icon"><span class="visually-hidden"><f:translate key="decisions.column.type" domain="webcon_jev.module" /></span></th>
                            <th scope="col"><f:translate key="decisions.column.title" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="decisions.column.questions" domain="webcon_jev.module" /></th>
                            <th scope="col" class="text-end"><f:translate key="decisions.column.threshold" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="decisions.column.default" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="decisions.column.usage" domain="webcon_jev.module" /></th>
                            <th scope="col"><f:translate key="decisions.column.runs" domain="webcon_jev.module" /></th>
                            <th scope="col" class="col-control"><span class="visually-hidden"><f:translate key="decisions.column.actions" domain="webcon_jev.module" /></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{rows}" as="row">
                            <f:variable name="name">{f:if(condition: row.decision.title, then: row.decision.title, else: row.decision.identifier)}</f:variable>
                            <tr data-webcon-jev-decision="{row.decision.uid}">
                                <td class="col-icon"><core:icon identifier="tx_webconjev_decision" /></td>
                                <td>
                                    <a href="{row.editUrl}" class="fw-bold">{name}</a>
                                    <f:if condition="{row.decision.hidden}">
                                        <span class="badge badge-warning" title="{f:translate(key: 'decisions.disabled.description', domain: 'webcon_jev.module')}"><f:translate key="decisions.disabled" domain="webcon_jev.module" /></span>
                                    </f:if>
                                    <div class="webcon-jev-mono text-variant">{row.decision.identifier}</div>
                                </td>
                                <td>
                                    <f:if condition="{row.decision.questions}">
                                        <f:then>
                                            <ul class="webcon-jev-chips">
                                                <f:for each="{row.decision.questions}" as="question">
                                                    <li class="badge badge-default"><span class="webcon-jev-mono">{question.name}</span> · <f:translate key="type.{question.type}" domain="webcon_jev.module" /></li>
                                                </f:for>
                                            </ul>
                                        </f:then>
                                        <f:else>
                                            <span class="badge badge-warning"><f:translate key="decisions.noQuestions" domain="webcon_jev.module" /></span>
                                        </f:else>
                                    </f:if>
                                </td>
                                <td class="text-end"><jev:format.number value="{row.decision.confidenceThreshold}" decimals="2" /></td>
                                <td>
                                    <f:if condition="{row.decision.defaultOutcome}">
                                        <f:then><span class="webcon-jev-mono">{row.decision.defaultOutcome}</span></f:then>
                                        <f:else><span class="text-variant">—</span></f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <f:if condition="{row.usage.forms} || {row.usage.rules}">
                                        <f:then>
                                            <f:if condition="{row.usage.forms}"><div><f:translate key="decisions.usage.forms" domain="webcon_jev.module" arguments="{count: row.usage.forms}" /></div></f:if>
                                            <f:if condition="{row.usage.rules}"><div><f:translate key="decisions.usage.rules" domain="webcon_jev.module" arguments="{count: row.usage.rules}" /></div></f:if>
                                        </f:then>
                                        <f:else><span class="text-variant"><f:translate key="decisions.usage.none" domain="webcon_jev.module" /></span></f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <f:if condition="{row.runs}">
                                        <f:then>
                                            <a href="{row.runLogUrl}"><f:translate key="decisions.runs.count" domain="webcon_jev.module" arguments="{count: row.runs.runs}" /></a>
                                            <f:if condition="{row.runs.fallbacks}">
                                                <span class="badge badge-danger"><f:translate key="decisions.runs.fallbacks" domain="webcon_jev.module" arguments="{count: row.runs.fallbacks}" /></span>
                                            </f:if>
                                        </f:then>
                                        <f:else><span class="text-variant"><f:translate key="decisions.runs.none" domain="webcon_jev.module" /></span></f:else>
                                    </f:if>
                                </td>
                                <td class="col-control">
                                    <div class="btn-group" role="group" aria-label="{f:translate(key: 'decisions.actions.label', domain: 'webcon_jev.module', arguments: {0: name})}">
                                        <a class="btn btn-default" href="{row.editUrl}" title="{f:translate(key: 'decisions.action.edit', domain: 'webcon_jev.module')}">
                                            <core:icon identifier="actions-open" />
                                            <span class="visually-hidden"><f:translate key="decisions.action.edit" domain="webcon_jev.module" /></span>
                                        </a>
                                        <a class="btn btn-default" href="{row.tryUrl}" title="{f:translate(key: 'decisions.action.try', domain: 'webcon_jev.module')}">
                                            <core:icon identifier="actions-play" />
                                            <span class="visually-hidden"><f:translate key="decisions.action.try" domain="webcon_jev.module" /></span>
                                        </a>
                                        <a class="btn btn-default" href="{row.runLogUrl}" title="{f:translate(key: 'decisions.action.runs', domain: 'webcon_jev.module')}">
                                            <core:icon identifier="actions-history" />
                                            <span class="visually-hidden"><f:translate key="decisions.action.runs" domain="webcon_jev.module" /></span>
                                        </a>
                                        <a class="btn btn-default" href="{row.recordUrl}" title="{f:translate(key: 'decisions.action.record', domain: 'webcon_jev.module')}">
                                            <core:icon identifier="actions-window-open" />
                                            <span class="visually-hidden"><f:translate key="decisions.action.record" domain="webcon_jev.module" /></span>
                                        </a>
                                        <button
                                            type="button"
                                            class="btn btn-default"
                                            title="{f:translate(key: 'decisions.action.delete', domain: 'webcon_jev.module')}"
                                            data-webcon-jev-delete="{row.decision.uid}"
                                            data-title="{name}"
                                            data-forms="{row.usage.forms}"
                                            data-rules="{row.usage.rules}"
                                        >
                                            <core:icon identifier="actions-delete" />
                                            <span class="visually-hidden"><f:translate key="decisions.action.delete" domain="webcon_jev.module" /></span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <f:be.infobox
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                title="{f:translate(key: 'decisions.empty.title', domain: 'webcon_jev.module')}"
                iconName="tx_webconjev_decision"
            >
                <p><f:translate key="decisions.empty.message" domain="webcon_jev.module" /></p>
                <a class="btn btn-primary" href="{newUrl}">
                    <core:icon identifier="actions-plus" />
                    <f:translate key="decisions.empty.action" domain="webcon_jev.module" />
                </a>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>

</html>
