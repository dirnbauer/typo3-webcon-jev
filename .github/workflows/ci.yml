name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The powermail forks come from VCS repositories; the job token is for the API rate limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  lint:
    name: Lint & coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: intl, sodium
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: Lint PHP
        run: find Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - run: composer ci:cgl
      # The backend module's JavaScript is plain ES modules, loaded as they are through the import
      # map: there is no build that would catch a syntax error before a browser does.
      - name: Lint JavaScript
        run: for file in Resources/Public/JavaScript/*.js; do node --input-type=module --check < "$file" || exit 1; done
      - name: Lint XLIFF
        run: find Resources/Private/Language -name '*.xlf' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(false); exit(simplexml_load_file($argv[1]) === false ? 1 : 0);'

  phpstan:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: intl, sodium
      - run: composer install --no-interaction --no-progress
      - run: composer ci:phpstan

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: intl, sodium
      - run: composer install --no-interaction --no-progress
      - run: composer ci:tests:unit

  functional:
    name: Functional tests (PHP ${{ matrix.php }}, MariaDB 10.11)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: funcp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseName: func_test
      typo3DatabaseUsername: root
      typo3DatabasePassword: funcp
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, pdo_mysql, mysqli, gd, zip, sodium
      - run: composer install --no-interaction --no-progress
      - run: composer ci:tests:functional
